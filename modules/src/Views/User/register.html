<div class="container">
    <header>
        <h1>SAEManager - Inscription</h1>
        <nav>
            <a href="/login">Se connecter</a>
            <a href="/register" class="active">S'inscrire</a>
        </nav>
    </header>

    <main>
        {{ERROR_MESSAGES}}

        <form action="/register" method="post" class="registration-form">
            <div class="form-section">
                <h3>Informations personnelles</h3>
                
                <div class="form-group">
                    <label for="id">Identifiant AMU *</label>
                    <input required type="text" id="id" name="id" 
                           minlength="3" maxlength="30" pattern="[a-zA-Z0-9._-]+">
                </div>

                <div class="form-group">
                    <fieldset>
                        <legend>Civilité *</legend>
                        <label><input type="radio" name="gender" value="male" required> Homme</label>
                        <label><input type="radio" name="gender" value="female" required> Femme</label>
                        <label><input type="radio" name="gender" value="other" required> Autre</label>
                    </fieldset>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fname">Prénom *</label>
                        <input required type="text" id="fname" name="fname" 
                               pattern="[A-Za-zÀ-ÖØ-öø-ÿ\-']+">
                    </div>
                    <div class="form-group">
                        <label for="lname">Nom *</label>
                        <input required type="text" id="lname" name="lname" 
                               pattern="[A-Za-zÀ-ÖØ-öø-ÿ\-']+">
                    </div>
                </div>

                <div class="form-group">
                    <label for="user_type">Statut *</label>
                    <select name="user_type" id="user_type" required>
                        <option value="">-- Sélectionner --</option>
                        <option value="student">Étudiant</option>
                        <option value="professor">Responsable SAE</option>
                        <option value="companies">Partenaire</option>
                    </select>
                </div>
            </div>

            <div class="form-section">
                <h3>Contact</h3>
                
                <div class="form-group">
                    <label for="email">Email AMU *</label>
                    <input required type="email" id="email" name="email" 
                           pattern="^[a-zA-ZÀ-ÿ\-']+\.[a-zA-ZÀ-ÿ\-']+(\.[0-9]+)?@(etu\.)?univ-amu\.fr$">
                </div>

                <div class="form-group">
                    <label for="tel">Téléphone *</label>
                    <input required type="tel" id="tel" name="tel" 
                           pattern="0[467][0-9]{8}" maxlength="10">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dob">Date de naissance *</label>
                        <input required type="date" id="dob" name="dob" 
                               min="1940-01-01" max="{{MAX_BIRTH_DATE}}">
                    </div>
                    <div class="form-group">
                        <label for="city">Ville *</label>
                        <input required type="text" id="city" name="city" 
                               pattern="[A-Za-zÀ-ÖØ-öø-ÿ\- ]+">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3>Sécurité</h3>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="pwd">Mot de passe *</label>
                        <input required type="password" id="pwd" name="pwd" minlength="8">
                    </div>
                    <div class="form-group">
                        <label for="pwdverif">Confirmer *</label>
                        <input required type="password" id="pwdverif" name="pwdverif" minlength="8">
                    </div>
                </div>
            </div>

            <div id="etudiantFields" class="form-section">
                <h3>Informations académiques</h3>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="year">Année *</label>
                        <select id="year" name="year">
                            <option value="">-- Sélectionner --</option>
                            <option value="1" >BUT 1</option>
                            <option value="2">BUT 2</option>
                            <option value="3">BUT 3</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="parcours">Parcours</label>
                        <select id="parcours" name="parcours">
                            <option value="">-- Sélectionner --</option>
                            <option value="A">Parcours A</option>
                            <option value="B">Parcours B</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="td">Groupe TD *</label>
                        <select id="td" name="td">
                            <option value="">-- Sélectionner --</option>
                            <option value="TD1" >TD1</option>
                            <option value="TD2" >TD2</option>
                            <option value="TD3" >TD3</option>
                            <option value="TD4" >TD4</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="tp">Groupe TP *</label>
                        <select id="tp" name="tp">
                            <option value="">-- Sélectionner --</option>
                            <option value="TPA" >TP A</option>
                            <option value="TPB" >TP B</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <label class="checkbox-label">
                    <input required type="checkbox" name="terms">
                    J'accepte les conditions générales
                </label>
                
                <button type="submit" class="btn-primary">S'inscrire</button>
            </div>
        </form>
    </main>
</div>
