name: PHP Quality Checks, Documentation and UML Generation

on:
  push:
  pull_request:
    branches: [ dev, develop ]

# Add permissions for gh-pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git diff

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_pgsql, dom, xml, intl, fileinfo
          coverage: xdebug
          tools: composer, phpcs, phpstan, phpunit

      # Cache Composer dependencies
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Get list of changed PHP files
        id: changed_files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
          else
            BASE_REF="HEAD^"
          fi
          
          git fetch origin $BASE_REF || true
          FILES=$(git diff --name-only --diff-filter=ACMR origin/$BASE_REF...HEAD | grep '\.php$' || echo "")
          
          if [ -z "$FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No PHP files changed"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changed_files<<EOF" >> $GITHUB_OUTPUT
            echo "$FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "Modified PHP files:"
            echo "$FILES"
          fi

      # Code Style Check - only if PHP files changed
      - name: Check PHP Code Style (PSR-12)
        if: steps.changed_files.outputs.has_changes == 'true'
        run: |
          echo "${{ steps.changed_files.outputs.changed_files }}" | \
          xargs -r phpcs --standard=PSR12 --colors --ignore=*/vendor/*,*/_assets/*,*/tests/*

      # Static Analysis - only if PHP files changed
      - name: Run PHPStan Static Analysis
        if: steps.changed_files.outputs.has_changes == 'true'
        run: |
          echo "${{ steps.changed_files.outputs.changed_files }}" | \
          xargs -r phpstan analyse --level=8 --no-progress --error-format=github --memory-limit=512M

      # Unit Tests
      - name: Run PHPUnit Tests
        run: |
          phpunit --configuration phpunit.xml \
          --coverage-text \
          --coverage-clover=coverage.xml \
          --testdox

      # Test Coverage Check
      - name: Check Test Coverage
        run: |
          php App/tests/coverage-checker.php coverage.xml 10
        continue-on-error: true

      # Security Check
      - name: Security Audit
        run: composer audit --no-dev
        continue-on-error: true

      # Upload Coverage
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

      # Documentation Check - only if PHP files changed
      - name: Check PHPDoc Documentation
        run: |
          echo "${{ steps.changed_files.outputs.changed_files }}" | \
          xargs -r phpcs --standard=phpcs-phpdoc.xml --ignore=*/vendor/*,*/tests/*
        continue-on-error: true

      # Create PHPDoc Documentation Folder
      - name: Ensure docs directory exists
        if: github.ref == 'refs/heads/dev' && steps.changed_files.outputs.has_changes == 'true'
        run: mkdir -p docs/api

      # Generate PHPDoc Documentation via composer - only if PHP files changed
      - name: Generate PHPDoc Documentation
        if: github.ref == 'refs/heads/dev' && steps.changed_files.outputs.has_changes == 'true'
        run: |
          composer run-script phpdoc || echo "PHPDoc generation completed with warnings"
        continue-on-error: true

      # Deploy PHPDoc to GitHub Pages - only when push on dev
      - name: Deploy PHPDoc to GitHub Pages
        if: github.ref == 'refs/heads/dev' && steps.changed_files.outputs.has_changes == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/api
          publish_branch: gh-pages
          force_orphan: true

      # Update UML in asset/UML
      - name : Update UML diagram
        if: steps.changed_files.outputs.has_changes == 'true'
        run: |
          composer require --dev smeghead/php-class-diagram
          sudo apt-get install -y default-jre graphviz
          wget https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar
          ./vendor/bin/php-class-diagram --exclude='Validator' \
          --svg-topurl='https://github.com/RADJOU-Dinesh-24003262/SAEManager/tree/dev/App/src' \
          App/src  > asset/UML/class-diagram.puml
          java -jar plantuml.jar -tsvg asset/UML/class-diagram.puml
          echo "UML diagram generated successfully"

      - name: Commit UML changes
        if: steps.changed_files.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add asset/UML/
          git diff --staged --quiet || git commit -m "chore: update UML diagrams"
          git push

      # Summary
      - name: Quality Summary
        if: always()
        run: |
          echo "## Quality Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks Performed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code Style (PSR-12)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Static Analysis (PHPStan)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Documentation Check (PHPDoc)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ PHPDoc Documentation Generated" >> $GITHUB_STEP_SUMMARY