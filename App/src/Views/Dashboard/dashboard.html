<header class="profile-header {{USER_TYPE_CLASS}}">
    <svg class="profile-avatar" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="90" fill="#eee"/>
        <circle cx="100" cy="80" r="30" fill="#666"/>
        <path d="M50 150 Q100 120 150 150" fill="#666"/>
    </svg>
    <div class="profile-info">
        <p class="user-badge">{{USER_TYPE_LABEL}}</p>
        <h1>{{USER_NAME}}</h1>
        <p class="email">{{USER_EMAIL}}</p>

        <div class="profile-meta">
            {{USER_META_INFO}}
        </div>
    </div>
</header>

<main class="container-fluid">
    <!-- Warning messages -->
    {{ERROR_MESSAGES}}
    {{SUCCESS_MESSAGE}}
    <div class="main-layout">
        <aside class="sidebar">
            <nav aria-label="Navigation principale">
                <h2 class="visually-hidden">Menu</h2>

                <!-- Section SAE (optionnal : depends on the type of user) -->
                {{SAE_NAVIGATION}}


                <!-- Section Parameters -->
                <div class="nav-section">
                    <h3>Paramètres</h3>
                    <a href="/settings">Accéder aux paramètres</a>
                    <a href="/logout">Déconnexion</a>
                </div>
            </nav>
        </aside>
        <div class="divider" role="separator"></div>


        <section class="content-area">
            <h2 class="section-title">
                Mes SAEs
            </h2>
            
            {{SAE_CONTENT}}
        </section>
    </div>
</main>
